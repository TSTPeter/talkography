name: Publish to GitHub Pages

# Run by hand from the Actions tab. First set Settings, Pages, Source to "GitHub Actions".
# See "Putting it on an iPad" in README.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Collect the files the app serves
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js vendor icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
